<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>乘风兜一圈 · Pelican Ride</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4eb;color:#243b3a;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:48px 32px 24px}.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:3px}.mark{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;background:#ee835b;border-radius:50%}h1{font-size:clamp(34px,5vw,60px);font-weight:500;letter-spacing:-2px;margin:48px 0 12px}p{font-size:14px;color:#74817a;letter-spacing:2px;margin:0}.scene{width:100%;display:block;margin-top:24px;border-radius:24px;background:#e7eee3}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:16px}.caption{font-size:12px;color:#77867d;letter-spacing:2px}button{border:1px solid #c7d0c5;background:transparent;border-radius:30px;padding:12px 20px;color:#304c43;cursor:pointer;font:inherit;font-size:13px}button:hover{background:#e4eade}button:focus-visible{outline:3px solid #e58a55;outline-offset:4px}.wheel{animation:spin 1.4s linear infinite}.rider{animation:bob .7s ease-in-out infinite}.scarf{animation:wave .7s ease-in-out infinite;transform-origin:472px 231px}.cloud{animation:drift 24s linear infinite}.far{animation:drift 40s linear infinite}.road{animation:drift 2.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-3px)}}@keyframes wave{50%{transform:rotate(-5deg)}}@keyframes drift{to{transform:translateX(-1000px)}}.paused *{animation-play-state:paused!important}@media(prefers-reduced-motion:reduce){.scene *{animation-play-state:paused!important}}@media(max-width:600px){main{padding:28px 18px}.top{font-size:10px;letter-spacing:1px}h1{margin-top:36px}.caption{font-size:10px;letter-spacing:0}.scene{border-radius:16px}}
</style>
</head>
<body>
<main>
 <div class="top"><span class="mark"><i class="dot"></i> LITTLE WANDER CLUB</span><span>VOL. 01 / 海岸骑行</span></div>
 <h1>好天气，兜一圈。</h1>
 <p>一只鹈鹕，一辆单车，和不着急的下午。</p>
 <svg class="scene" id="scene" viewBox="0 0 1000 570" role="img" aria-labelledby="scene-title scene-desc">
 <title id="scene-title">鹈鹕骑自行车</title><desc id="scene-desc">戴着绿色帽子、系着橘色围巾的白色鹈鹕骑着青绿色自行车穿过海岸，双脚踩踏，车轮旋转，云朵和道路向后移动。</desc>
 <defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e4ede2"/><stop offset="1" stop-color="#f2efdc"/></linearGradient>
  <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#b9d5c5"/><stop offset="1" stop-color="#d6e1ca"/></linearGradient>
  <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".5" fill="#486e58" opacity=".09"/></pattern>
  <g id="clouds" fill="#fffcf0" opacity=".8"><path d="M95 126q-10-21 13-25 4-28 30-20 17-12 30 9 25-1 24 24H95Z"/><path d="M713 97q-5-17 16-21 4-22 28-18 23-12 38 16 23-1 24 23Z"/></g>
  <g id="hills"><path d="M0 294Q93 227 190 287T400 283T630 281T820 280T1000 294V340H0Z" fill="#adc5b0"/><path d="M0 318Q145 270 280 313T520 310T760 316T1000 318V348H0Z" fill="#c5d5b9"/></g>
  <g id="roadmarks" stroke="#f5f0d9" stroke-width="4" stroke-linecap="round"><path d="M30 508h57m145 0h57m145 0h57m145 0h57m145 0h57"/></g>
  <g id="spokes" stroke="#497367" stroke-width="2" opacity=".65"><path d="M-62 0H62M0-62V62M-44-44l88 88m-88 0 88-88M-57-24 57 24m-81 33 48-114m-81 81 114-48m-81-33 48 114"/></g>
 </defs>
 <path fill="url(#sky)" d="M0 0h1000v570H0z"/>
 <circle cx="779" cy="149" r="55" fill="#f4cb79"/><circle cx="779" cy="149" r="69" fill="none" stroke="#f4cb79" opacity=".2"/>
 <g class="cloud"><use href="#clouds"/><use href="#clouds" x="1000"/></g>
 <g class="far"><use href="#hills"/><use href="#hills" x="1000"/></g>
 <path fill="url(#sea)" d="M0 332h1000v85H0z"/>
 <g stroke="#edf0d9" stroke-width="2" opacity=".7"><path d="M66 354h112m76 20h81m341-20h144m-284 37h129m202-14h91"/></g>
 <path d="M0 406Q280 390 516 410T1000 401V570H0Z" fill="#dedcbb"/>
 <path d="M0 446h1000v105H0z" fill="#b7c4a6"/>
 <path d="M0 447h1000" stroke="#f4edd7" stroke-width="5"/>
 <g class="road"><use href="#roadmarks"/><use href="#roadmarks" x="1000"/></g>
 <ellipse cx="502" cy="464" rx="203" ry="12" fill="#506d56" opacity=".12"/>
 <!-- Bicycle wheels and fixed frame -->
 <g fill="#e6e5ce" stroke="#294e45" stroke-width="9"><circle cx="364" cy="391" r="69"/><circle cx="643" cy="391" r="69"/></g>
 <g fill="none" stroke="#fcf5de" stroke-width="3"><circle cx="364" cy="391" r="62"/><circle cx="643" cy="391" r="62"/></g>
 <g transform="translate(364 391)"><g class="wheel"><use href="#spokes"/><path d="M0-59v10" stroke="#ecac68" stroke-width="5"/></g></g>
 <g transform="translate(643 391)"><g class="wheel"><use href="#spokes"/><path d="M0-59v10" stroke="#ecac68" stroke-width="5"/></g></g>
 <g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M364 391 431 296 488 391H364L602 303 488 391 431 296M602 303l41 88" stroke="#2d8274" stroke-width="9"/><path d="m602 303-12-40q-4-12 10-14h28" stroke="#34564c" stroke-width="7"/><path d="M617 249h21" stroke="#ad7754" stroke-width="10"/><path d="m431 296-8-23" stroke="#34564c" stroke-width="6"/><path d="M400 274h47" stroke="#5c5543" stroke-width="12"/><path d="M350 315h50m-40 0-15 43" stroke="#678678" stroke-width="5"/></g>
 <g fill="#34584d"><circle cx="364" cy="391" r="7"/><circle cx="643" cy="391" r="7"/></g>
 <!-- Pedals and legs are linked to the same rotating crank by JavaScript. -->
 <g id="far-leg" fill="none" stroke="#c88943" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path id="leg-back"/></g>
 <g class="rider">
  <path d="m399 263-38-25 14 42 39 9" fill="#edf0df" stroke="#34584d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M402 226q26-32 62-36l29-62q13-31 41-24 33 7 21 40l-30 64q-9 23-9 44-4 34-47 42-62 11-74-24-8-25 7-44Z" fill="#fcf9e9" stroke="#34584d" stroke-width="3"/>
  <path d="M409 237q26-21 68-21-3 35-41 52-23 4-28-11" fill="#e0e5d2" stroke="#718779" stroke-width="2.5"/>
  <path d="M451 224q31 0 63 16l77 13" fill="none" stroke="#34584d" stroke-width="18" stroke-linecap="round"/>
  <path d="M451 222q31 0 63 16l77 13" fill="none" stroke="#f4f3e2" stroke-width="13" stroke-linecap="round"/>
  <path d="M541 142 650 157q-32 58-88 23l-24-29" fill="#edb969" stroke="#34584d" stroke-width="3"/>
  <path d="m541 141 116 14q7 2 0 6H541" fill="#eea64b" stroke="#34584d" stroke-width="3" stroke-linejoin="round"/>
  <path d="M566 169q31 12 63-3" fill="none" stroke="#d89951" stroke-width="2"/>
  <circle cx="534" cy="130" r="4.5" fill="#29483e"/><circle cx="535" cy="129" r="1.3" fill="#fff"/>
  <path d="M520 118q7-5 13-3" fill="none" stroke="#34584d" stroke-width="2" stroke-linecap="round"/>
  <path d="M495 111q-1-33 27-32 24 1 25 29" fill="#497f65" stroke="#34584d" stroke-width="3"/>
  <path d="m489 110 69-2q10 2 10 7l-78 3Z" fill="#3b6954" stroke="#34584d" stroke-width="3"/>
  <path class="scarf" d="M485 197q-35 10-68-8l-21 5 13 13q43 13 76 2" fill="#e77f57" stroke="#a95e42" stroke-width="2"/>
  <path d="m489 191 25 10-5 13-26-11Z" fill="#ed8d62" stroke="#ae6448" stroke-width="2"/>
 </g>
 <path id="leg-front" fill="none" stroke="#e4a655" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
 <circle cx="488" cy="391" r="15" fill="#f0e8cc" stroke="#34584d" stroke-width="4"/>
 <path id="crank" stroke="#34584d" stroke-width="5" stroke-linecap="round"/>
 <path id="foot-back" stroke="#b77e3c" stroke-width="10" stroke-linecap="round"/>
 <path id="foot-front" stroke="#e4a655" stroke-width="11" stroke-linecap="round"/>
 <g fill="#6e8c66"><path d="m80 434-9-26 16 16 5-37 5 36 16-12-9 25Z"/><path d="m892 431-8-18 14 10 6-28 3 30 15-10-11 17Z"/></g>
 <path fill="url(#grain)" d="M0 0h1000v570H0z" pointer-events="none"/>
 <text x="39" y="540" font-family="monospace" font-size="11" fill="#52715b" letter-spacing="3">TAKE THE SCENIC ROUTE.</text>
 </svg>
 <div class="bottom"><span class="caption">海风正好 · 今日目的地：快乐</span><button id="toggle" type="button" aria-pressed="false">暂停动画 Ⅱ</button></div>
</main>
<script>
const scene=document.getElementById('scene'),button=document.getElementById('toggle');
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
let paused=reduced.matches,time=0,last=0;
const parts=Object.fromEntries(['leg-front','leg-back','crank','foot-front','foot-back'].map(id=>[id,document.getElementById(id)]));
function draw(){
 const a=time/1400*Math.PI*2,x=488+29*Math.cos(a),y=391+29*Math.sin(a),bx=976-x,by=782-y;
 parts['leg-front'].setAttribute('d',`M461 280 Q${520+(x-488)*.25} 316 ${x} ${y}`);
 parts['leg-back'].setAttribute('d',`M437 281 Q${469+(bx-488)*.3} 321 ${bx} ${by}`);
 parts.crank.setAttribute('d',`M${bx} ${by}L${x} ${y}`);
 parts['foot-front'].setAttribute('d',`M${x-9} ${y-2}h27`);
 parts['foot-back'].setAttribute('d',`M${bx-9} ${by-2}h27`);
}
function sync(){scene.classList.toggle('paused',paused);button.textContent=paused?'播放动画 ▶':'暂停动画 Ⅱ';button.setAttribute('aria-pressed',String(paused));}
button.addEventListener('click',()=>{paused=!paused;sync()});
reduced.addEventListener('change',e=>{paused=e.matches;sync()});
function frame(now){if(last&&!paused)time+=Math.min(now-last,50);last=now;draw();requestAnimationFrame(frame)}
sync();draw();requestAnimationFrame(frame);
</script>
</body>
</html>
