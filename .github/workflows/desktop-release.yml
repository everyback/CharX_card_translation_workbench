name: Windows Desktop Releases

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build portable and installer EXEs
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tagVersion) {
            throw "Release tag ${{ github.ref_name }} does not match package.json version $packageVersion"
          }

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Prepare desktop build
        run: npm run desktop:prepare

      - name: Build portable package
        run: npx electron-builder --win portable --publish never

      - name: Verify slim desktop package
        shell: pwsh
        run: |
          $appRoot = 'release/win-unpacked/resources/app.asar.unpacked'
          if (-not (Test-Path 'release/win-unpacked/resources/app.asar')) { throw 'ASAR archive is missing' }
          foreach ($requiredPath in @('package.json', 'dist-server/server/db-worker.js', 'patches/risuai/install.mjs')) {
            if (-not (Test-Path "$appRoot/$requiredPath")) { throw "Required runtime file is missing: $requiredPath" }
          }
          if (-not (Test-Path "$appRoot/dist-server/server/index.js")) {
            throw 'Packaged backend entry is missing'
          }
          foreach ($removedPath in @('node_modules/react', 'node_modules/react-dom', 'node_modules/lucide-react', 'node_modules/tesseract.js', 'node_modules/tesseract.js-core', 'dist-server/server/domain/resources/ocr.js')) {
            if (Test-Path "$appRoot/$removedPath") {
              throw "Removed OCR component is still packaged: $removedPath"
            }
          }
          $locales = @(Get-ChildItem 'release/win-unpacked/locales/*.pak' | ForEach-Object BaseName | Sort-Object)
          if (($locales -join ',') -ne 'en-US,ja,ko,zh-CN,zh-TW') { throw "Unexpected locales: $locales" }

      - name: Smoke test packaged backend and frontend
        shell: pwsh
        run: |
          $desktopProcess = Start-Process -FilePath 'release/win-unpacked/CardLoom Translate.exe' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($desktopProcess.HasExited) { throw 'Packaged application exited before startup' }
              try {
                Invoke-RestMethod 'http://127.0.0.1:8787/api/health' | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged application did not become healthy' }
            Invoke-RestMethod 'http://127.0.0.1:8787/api/projects' | Out-Null
            $page = Invoke-WebRequest 'http://127.0.0.1:8787/'
            if ($page.Content -notmatch '<div id="root">') { throw 'Packaged frontend is missing' }
          } finally {
            if (-not $desktopProcess.HasExited) { Stop-Process -Id $desktopProcess.Id -Force }
          }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: cardloom-translate-portable-${{ github.run_id }}
          path: release/CardLoom-Translate-Portable-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build installer package
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer EXE
        uses: actions/upload-artifact@v6
        with:
          name: cardloom-translate-installer-${{ github.run_id }}
          path: |
            release/CardLoom-Translate-Setup-*.exe
            release/CardLoom-Translate-Setup-*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  publish-tag-release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v6
        with:
          name: cardloom-translate-portable-${{ github.run_id }}
          path: release-assets

      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: cardloom-translate-installer-${{ github.run_id }}
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" release-assets/* --title "${{ github.ref_name }}" --generate-notes

  publish-nightly-release:
    name: Publish rolling Nightly Release
    if: github.ref == 'refs/heads/master'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable artifact
        uses: actions/download-artifact@v6
        with:
          name: cardloom-translate-portable-${{ github.run_id }}
          path: release-assets

      - name: Download installer artifact
        uses: actions/download-artifact@v6
        with:
          name: cardloom-translate-installer-${{ github.run_id }}
          path: release-assets

      - name: Update Nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            release_id="$(gh api "repos/${GH_REPO}/releases/tags/nightly" --jq '.id')"
            asset_ids="$(gh api --paginate "repos/${GH_REPO}/releases/${release_id}/assets" --jq '.[].id')"
            for asset_id in ${asset_ids}; do
              gh api --method DELETE "repos/${GH_REPO}/releases/assets/${asset_id}"
            done
            gh release upload nightly release-assets/* --clobber
            gh release edit nightly \
              --title "CardLoom Translate Nightly" \
              --notes "Rolling preview build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          else
            gh release create nightly release-assets/* \
              --title "CardLoom Translate Nightly" \
              --notes "Rolling preview build from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi
