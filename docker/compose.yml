name: card-translation-workbench

services:
  card-translation-workbench:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: card-translation-workbench:local
    container_name: card-translation-workbench
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      WORKBENCH_HOST: 0.0.0.0
      WORKBENCH_PORT: 8787
      WORKBENCH_DATA_DIR: /app/data
      WORKBENCH_WEB_DIR: /app/dist
    ports:
      - "127.0.0.1:${WORKBENCH_BIND_PORT:-8787}:8787"
    volumes:
      - workbench-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  workbench-data:
